name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JSON assets
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const files = [
            'rules.json',
            'pinyin-p.json',
            'pinyin-u.json',
            'pinyin-b.json',
            'pinyin-t.json',
            ...fs.readdirSync('rules/builtin')
              .filter(x => x.endsWith('.json'))
              .sort()
              .map(x => 'rules/builtin/' + x),
          ];
          let bad = false;
          for (const file of files) {
            try {
              JSON.parse(fs.readFileSync(file, 'utf8'));
              console.log('OK      ' + file);
            } catch (e) {
              bad = true;
              console.error('INVALID ' + file + ': ' + e.message);
            }
          }
          if (bad) process.exit(1);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
